<p>Mapo Tofu is a dish with meats, flavor, and most of all, <em>spiciness.</em> It consists of tofu set in a spicy sauce, typically a thin, oily, and bright red suspension. It is a very flavourful, easy-to-prepare, and spicy dish. </p>

<h2 id="ingredients">Ingredients</h2>
    <!-- TODO 5: List at least 6 ingredients.
         Ask yourself: does the ORDER matter here?
         Pick <ul> or <ol> based on your answer. -->
<p>You will need:<br></p>
<ul>
  <li>1 onion, sliced</li>
  <li>1 small piece of ginger, minced (about 2 tsp)</li>
  <li>1 to 2 tsp crushed dried chile pepper</li>
  <li>Minced beef or pork</li>
  <li>4 cloves of garlic, minced</li>
  <li>Silken tofu, cubed</li>
  <li>2 tbsp chili bean paste (la doubanjiang)</li>
  <li>1 tbsp Szechuan pepper, roasted and ground</li>
</ul>



    <!-- ============================================
         SECTION 4: STEPS
         ============================================ -->

    <!-- TODO 6: Add an h2 with id="steps" -->

<h2 id="steps">Steps</h2>
    <!-- TODO 7: List at least 5 steps in order.
         Does the order matter here? Pick accordingly. -->
<ol>
  <li>Saute the onion with the ginger and crushed chili.</li>
  <li>Add the minced meat and garlic, then fry until browned.</li>
  <li>Mix in the remaining ingredients, including the sliced mushrooms.</li>
  <li>Lower heat and simmer for 7 minutes.</li>
  <li>Serve over steamed jasmine rice.</li>
</ol>

        <ul>
            <li>Adding mushrooms. Boil for 10 minutes before the fourth step.</li>
            <li>Some extra chili pepper can be substituted for Szechuan pepper, but the taste and feeling will be different. Szechuan pepper has a numbing sensation, not heat.</li>

    </li>
