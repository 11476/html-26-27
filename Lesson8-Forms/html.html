<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
<h1>Club Sign-Up</h1>
<form action="https://bergentechcs.org" method="post">
    <label for="1">Full Name </label><input type="text" id="1" name="fullname" required placeholder="Son Doe"><br>
    <label for="2">Email </label><input type="email" id="2" name="email" required aria-required="true" placeholder="son@example.com" aria-placeholder="sample@example.com"><br>
    <label for="3">Date you can start</label><input type="date" id="3" name="Date"><br>
    <label for="4">Age:</label><input type="number" name="age" id="4" min="13" max="200000" placeholder="20 bajillion"><br>
    <fieldset>
        <legend>select yr'oue grade level</legend>
        <label for="5">Grade 9</label>
        <input type="radio" name="gradelevel" id="5"  value="9">
        <label for="6">Grade 10</label>
        <input type="radio" name="gradelevel" id="6"  value="10">
        <label for="7">Grade 11</label>
        <input type="radio" name="gradelevel" id="7" value="11">

        <label for="8">Grade 12</label>
        <input type="radio" name="gradelevel" id="7b" value="12">
    </fieldset>
    <fieldset>
        <legend>Which dyas can you meet?</legend>
        <label>Monday<input type="checkbox" name="days" id="Z" value="Monday"></label><br>
        <label>Tuesday<input type="checkbox" name="days" id="X" value="Chewsday"></label><br>
        <label>Wednesday<input type="checkbox" name="days" id="C" value="Wednesday"></label><br>
        <label>Thursday<input type="checkbox" name="days" id="V" value="Thursday"></label><br>
        <label>Friday<input type="checkbox" name="days" id="B" value="Friday"></label><br>
        <label>Sonday<input type="checkbox" name="days" id="M" value="Another Day"></label><br>
    </fieldset>
    <label > Why Do You Want to join ? <hr> <textarea name="a" id="N" cols="1000'" rows="1000"></textarea></label>
    <button type="submit">SUBMIT !!! <strong>SUBMITT!!!</strong></button>
</form>
</body>
</html>
